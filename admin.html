<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Admin - Autoturnos</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body class="bg-white text-black p-6">
<div id="admin-bar" style="position:fixed;top:0;left:0;width:100%;background:#000;color:white;padding:12px;z-index:9999;text-align:center;border-bottom:3px solid #00ff88;">
  <span style="font-weight:900;font-size:11px;">🔧 ADMIN: dariobrugo1@gmail.com</span>
  <button onclick="probarComo('basico')" class="bg-white text-black px-3 py-1 rounded-full text-[10px] font-black m-1 ml-3">BÁSICO</button>
  <button onclick="probarComo('pro')" class="bg-[#00ff88] text-black px-3 py-1 rounded-full text-[10px] font-black m-1">PRO</button>
  <button onclick="probarComo('premium')" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-[10px] font-black m-1">PREMIUM</button>
  <button onclick="probarComo('real')" class="bg-red-500 text-white px-3 py-1 rounded-full text-[10px] font-black m-1">REAL</button>
  <span id="current-test" style="margin-left:8px;font-size:10px;background:#222;padding:4px 8px;border-radius:20px;"></span>
</div>
<div style="height:60px;"></div>
<div class="max-w-6xl mx-auto">
<header class="flex justify-between items-center border-b pb-4"><h1 class="font-black text-2xl">PANEL ADMIN REAL</h1><a href="index.html" class="border-2 px-4 py-1 rounded-full text-[11px] font-black">VER WEB</a></header>
<div class="grid md:grid-cols-2 gap-4 mt-6">
  <div class="border-[3px] border-black rounded-[24px] p-6 bg-white shadow-[4px_4px_0px_#000]">
    <b class="text-[10px]">🤖 MI BOT - ON/OFF REAL (SUPABASE)</b>
    <div class="flex items-center gap-3 mt-4">
      <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="botSwitch" class="sr-only peer"><div class="w-14 h-7 bg-zinc-200 rounded-full peer peer-checked:bg-[#00ff88] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-black after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:after:translate-x-full"></div></label>
      <span id="botEstado" class="font-black text-[12px]"></span>
    </div>
    <p class="text-[10px] mt-2 opacity-60">Esto prende/apaga tu bot de verdad, no el de prueba.</p>
  </div>
  <div class="border-[3px] border-black rounded-[24px] p-6 bg-[#00ff88]/30 shadow-[4px_4px_0px_#000]">
    <b class="text-[10px]">💎 MI PACK REAL (SUPABASE)</b>
    <div class="flex gap-2 mt-4">
      <select id="selectPlan" class="flex-1 border-[2px] border-black rounded-full px-4 py-2.5 text-[12px] font-black bg-white"><option value="basico">BÁSICO</option><option value="pro">PRO</option><option value="premium">PREMIUM</option></select>
      <button onclick="cambiarMiPlan()" class="bg-black text-white px-5 rounded-full text-[11px] font-black">GUARDAR EN SUPABASE</button>
    </div>
    <p id="modoActual" class="text-[10px] mt-3 font-bold"></p>
  </div>
</div>
<div class="mt-6 border-[3px] border-black rounded-[28px] p-6"><h2 class="font-black">Clientes (Supabase)</h2><div id="lista" class="mt-4 text-[11px]">Cargando...</div></div>
</div>
<script>
const SUPABASE_URL="https://lubackahcsgvffenzlyf.supabase.co";
const SUPABASE_KEY="sb_publishable_vqeil5OkuX--2lNQOweZtw_Q3oVUv0n";
const ADMIN_EMAIL="dariobrugo1@gmail.com";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let testPlan = localStorage.getItem('test_plan_override') || null;

async function cargar(){
  document.getElementById('current-test').innerText = testPlan? `VIENDO COMO: ${testPlan.toUpperCase()}`: 'MODO REAL';
  document.getElementById('modoActual').innerText = testPlan? `MODO PRUEBA: ${testPlan.toUpperCase()} (no guarda en Supabase)` : 'MODO REAL - Cambios guardan en Supabase';
  try{
    const { data: yo } = await supabaseClient.from('usuarios').select('*').eq('email', ADMIN_EMAIL).single();
    if(yo){ document.getElementById('botSwitch').checked = yo.bot_activo!== false; document.getElementById('botEstado').textContent = yo.bot_activo!== false? '🟢 ACTIVO':'🔴 PAUSADO'; document.getElementById('selectPlan').value = yo.plan || 'basico'; }
    const { data: usuarios } = await supabaseClient.from('usuarios').select('*').order('id');
    let html='';
    usuarios?.forEach(u=>{
      html+=`<div class="flex justify-between items-center border-b py-3 text-[11px]"><span>${u.email} <b class="ml-2 px-2 py-0.5 rounded-full bg-black text-white text-[9px]">${(u.plan||'basico').toUpperCase()}</b> ${u.bot_activo===false?'<b class="text-red-600 ml-1">PAUSADO</b>':''} - ${u.conversaciones||0} conv</span><div class="flex gap-1"><button onclick="toggleCliente('${u.email}', ${u.bot_activo!== false})" class="border px-2 py-1 rounded-full text-[9px] font-black">${u.bot_activo!== false? 'PAUSAR':'ACTIVAR'}</button><select onchange="cambiarPlanCliente('${u.email}', this.value)" class="border rounded-full text-[9px] px-2 py-1"><option value="basico" ${u.plan==='basico'?'selected':''}>BAS</option><option value="pro" ${u.plan==='pro'?'selected':''}>PRO</option><option value="premium" ${u.plan==='premium'?'selected':''}>PRE</option></select></div></div>`;
    });
    document.getElementById('lista').innerHTML = html || 'No hay clientes aún';
  }catch(e){ document.getElementById('lista').innerHTML = 'Error: '+e.message+' - Fijate si creaste la columna bot_activo'; console.log(e); }
}
async function toggleCliente(email, actual){ await supabaseClient.from('usuarios').update({bot_activo:!actual}).eq('email', email); cargar(); }
async function cambiarPlanCliente(email, plan){ await supabaseClient.from('usuarios').update({plan}).eq('email', email); cargar(); }
async function cambiarMiPlan(){ const p=document.getElementById('selectPlan').value; const {error} = await supabaseClient.from('usuarios').update({plan:p}).eq('email', ADMIN_EMAIL); if(error) alert('Error: '+error.message); else alert('Pack cambiado a '+p+' en Supabase'); cargar(); }
document.getElementById('botSwitch').addEventListener('change', async e=>{ const {error} = await supabaseClient.from('usuarios').update({bot_activo:e.target.checked}).eq('email', ADMIN_EMAIL); if(error) alert('Tenés que crear la columna bot_activo en Supabase primero'); cargar(); });
function probarComo(plan){ if(plan==='real'){ localStorage.removeItem('test_plan_override'); testPlan=null; } else { localStorage.setItem('test_plan_override', plan); testPlan=plan; } cargar(); }
cargar();
</script>
</body></html>
