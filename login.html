<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - autoturnos</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-zinc-50 flex items-center justify-center min-h-screen p-6">
<div class="bg-white border-[3px] border-black rounded-[28px] p-8 w-full max-w-sm">
<h1 class="font-black text-2xl text-center">Autoturnos</h1>
<p class="text-[11px] text-zinc-500 text-center mt-1">Registrarse / Entrar</p>

<input id="email" type="email" autocomplete="off" placeholder="Tu email" class="w-full border-2 rounded-xl px-4 py-3 text-sm mt-6">
<input id="pass" type="password" autocomplete="new-password" placeholder="Crea una contraseña" class="w-full border-2 rounded-xl px-4 py-3 text-sm mt-3">

<button onclick="registrarse()" class="w-full bg-black text-white py-3 rounded-xl font-black text-sm mt-4">ENTRAR / REGISTRARME</button>

<p class="text-[10px] text-zinc-400 text-center mt-4">Si es tu primera vez te registra automático.</p>
<p id="msg" class="text-[11px] text-center mt-3 font-bold"></p>

<a href="index.html" class="block text-center text-[11px] mt-4 underline">Volver a la web</a>
</div>

<script>
const ADMIN_EMAIL = "dariobrugo1@gmail.com";

function registrarse(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('pass').value.trim();
  if(!email ||!pass){ document.getElementById('msg').textContent='Completa email y contraseña'; return; }

  let usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
  let usuarioExistente = usuarios.find(u=>u.email.toLowerCase()===email);

  let usuario;
  if(usuarioExistente){
    // Si ya existe, NO le borro el plan que pagó
    usuario = usuarioExistente;
  } else {
    // Si es nuevo, entra SIN PLAN - tiene que pagar
    usuario = {
      email: email,
      pass: pass,
      plan: 'sin_plan',
      fecha: new Date().toISOString()
    };
    usuarios.push(usuario);
    localStorage.setItem('usuarios', JSON.stringify(usuarios));
  }

  localStorage.setItem('usuarioLogueado', JSON.stringify(usuario));
  document.getElementById('msg').textContent='¡Listo! Entrando...';

  if(email === ADMIN_EMAIL.toLowerCase()){
    setTimeout(()=> window.location.href='admin.html', 800);
  } else {
    // Si no tiene plan, lo mando a ver los planes para comprar
    if(!usuario.plan || usuario.plan === 'sin_plan'){
      setTimeout(()=> window.location.href='index.html#planes', 800);
    } else {
      setTimeout(()=> window.location.href='dashboard.html', 800);
    }
  }
}
</script>
</body></html>
