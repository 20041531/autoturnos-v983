<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
.cal{max-width:400px;background:white;padding:20px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.15);margin:auto;position:relative;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:12px}
.d{padding:12px;border-radius:8px;border:1px solid #eee;background:#f2f2f2}
.d.bloq{background:#ff4444;color:white}
.d.hoy{border:2px solid #2196F3}
#candado{position:absolute;inset:0;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);z-index:99;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
#candado.off{display:none}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;margin-top:10px;cursor:pointer}
.btn-mp{background:#009ee3;color:white}
.btn-pp{background:#ffc439}
</style>
</head>
<body>
<div class="cal">
  <div class="head">
    <button onclick="cm(-1)">‹</button>
    <h3 id="mes"></h3>
    <button onclick="cm(1)">›</button>
  </div>
  <div class="dias" style="font-weight:bold;color:#666;font-size:12px"><div>Lun</div><div>Mar</div><div>Mie</div><div>Jue</div><div>Vie</div><div>Sab</div><div>Dom</div></div>
  <div class="dias" id="dias"></div>
  <p id="estado" style="font-size:13px;color:#666"></p>

  <div id="candado">
    <div style="font-size:60px">🔒</div>
    <h3>Calendario bloqueado</h3>
    <p style="font-size:14px;color:#555">Se ve pero no se puede usar hasta pagar</p>
    <button class="btn btn-mp" onclick="pagar()">Pagar con Mercado Pago</button>
    <button class="btn btn-pp" onclick="pagar()">Pagar con PayPal</button>
  </div>
</div>

<script>
let fecha = new Date();
let bloqueos = [];
let desbloqueado = localStorage.getItem('compra_ok')==='true' || location.search.includes('pago');

const supa = supabase.createClient("https://lubackahcsgvffenzlyf.supabase.co","sb_publishable_vqeil5OkuX--2lNQOweZtw_Q3oVUv0n");

function dibujar(){
  document.getElementById('mes').innerText = fecha.toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  let y=fecha.getFullYear(), m=fecha.getMonth(), total=new Date(y,m+1,0).getDate();
  let primer=new Date(y,m,1).getDay(); if(primer===0) primer=7;
  let html='';
  for(let i=1;i<primer;i++) html+='<div></div>';
  for(let d=1;d<=total;d++){
    let f=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let b=bloqueos.includes(f);
    html+=`<div class="d ${b?'bloq':''}">${d}</div>`;
  }
  document.getElementById('dias').innerHTML=html;
  document.getElementById('candado').className = desbloqueado ? 'off' : '';
  document.getElementById('estado').innerText = desbloqueado ? '✅ Desbloqueado' : '🔒 Bloqueado - Visible pero sin uso';
}

async function cargarBloqueos(){
  try{
    const {data} = await supa.from('calendario_bloqueos').select('fecha');
    if(data) bloqueos = data.map(x=>x.fecha);
  }catch(e){ console.log('Supabase fallo, muestro igual',e) }
  dibujar();
}

function cm(dir){fecha.setMonth(fecha.getMonth()+dir); dibujar()}
function pagar(){localStorage.setItem('compra_ok','true'); desbloqueado=true; dibujar()}

// DIBUJA SI O SI AUNQUE SUPABASE FALLE
dibujar();
cargarBloqueos();
</script>
</body>
</html>
